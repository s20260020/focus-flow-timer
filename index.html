<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="集中と休憩を気持ちよく切り替える、シンプルで使いやすい無料タイマー。">
<title>Focus Flow — 集中タイマー</title>
<style>
:root{color-scheme:dark;--bg:#090d1a;--panel:rgba(20,27,49,.82);--line:rgba(192,204,255,.14);--text:#f5f7ff;--muted:#9ba7c8;--purple:#9585ff;--mint:#54e0c2;--blue:#7eb6ff;--danger:#ff9d9d;--shadow:0 24px 80px #0005}
*{box-sizing:border-box}html{min-width:320px}body{margin:0;min-height:100vh;font-family:Inter,"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 10% 0%,#29245c 0,transparent 38%),radial-gradient(ellipse at 100% 100%,#103e49 0,transparent 34%),var(--bg);padding:24px;display:flex;justify-content:center;align-items:center}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b6adff;outline-offset:3px}.app{width:min(100%,920px)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 4px 22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.09em}.brand-icon{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,var(--purple),var(--mint));color:#10172a;box-shadow:0 8px 28px #8b7cff40}.brand-icon svg{width:23px;height:23px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.2em;margin-top:3px;font-weight:600}.top-actions{display:flex;gap:8px}.subtle-btn{border:1px solid var(--line);background:#ffffff08;color:var(--muted);padding:10px 12px;border-radius:12px;font-size:13px}.subtle-btn:hover{color:var(--text);background:#ffffff12}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(255px,.8fr);gap:16px}.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));backdrop-filter:blur(20px);border-radius:28px;box-shadow:var(--shadow)}.main-panel{padding:clamp(20px,4vw,38px);display:flex;flex-direction:column;align-items:center}.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;background:#05091480;border:1px solid #ffffff0c;border-radius:16px;width:min(100%,430px)}.mode{border:0;border-radius:12px;background:transparent;color:var(--muted);padding:11px 8px;font-size:13px;transition:.2s}.mode.active{background:#8f80ff27;color:#fff;box-shadow:inset 0 0 0 1px #9585ff62}.timer-shell{position:relative;width:min(100%,340px);aspect-ratio:1;display:grid;place-items:center;margin:20px 0 15px}.timer-svg{width:100%;height:100%;position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}.track,.arc{fill:none;stroke-width:5}.track{stroke:#ffffff0d}.arc{stroke:url(#timerGradient);stroke-linecap:round;filter:drop-shadow(0 0 8px #9585ff55);transition:stroke-dashoffset .18s linear}.timer-content{position:relative;text-align:center;display:flex;align-items:center;flex-direction:column;justify-content:center}.mode-label{font-size:11px;font-weight:750;letter-spacing:.22em;color:var(--muted)}.digits{font-size:clamp(56px,9vw,82px);font-weight:650;letter-spacing:-.07em;line-height:1.14;font-variant-numeric:tabular-nums;margin:10px 0 8px}.timer-note{font-size:13px;color:var(--muted);min-height:20px}.session-count{margin-top:14px;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dots{display:flex;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#ffffff20}.dot.done{background:var(--mint);box-shadow:0 0 8px #54e0c255}.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 16px}.primary{border:0;border-radius:16px;padding:15px 25px;min-width:164px;color:#11162a;font-weight:800;background:linear-gradient(115deg,#a397ff,#6ce7d0);box-shadow:0 10px 26px #8c7cff32;transition:transform .15s,filter .15s}.primary:hover{transform:translateY(-2px);filter:brightness(1.07)}.round-btn{width:49px;height:49px;border-radius:15px;border:1px solid var(--line);background:#ffffff08;color:var(--text);display:grid;place-items:center;font-size:20px}.round-btn:hover{background:#ffffff15}.round-btn svg{width:19px;height:19px}.message{height:20px;color:var(--mint);font-size:12px;text-align:center}
.side{padding:22px;display:flex;flex-direction:column;gap:22px}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section-heading h2{font-size:14px;margin:0;font-weight:750}.section-heading span{font-size:11px;color:var(--muted)}.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.preset{border:1px solid var(--line);background:#ffffff05;color:var(--text);text-align:left;padding:14px;border-radius:15px;transition:.18s}.preset:hover,.preset.active{border-color:#9585ff9c;background:#9585ff17}.preset strong{font-size:14px;display:block}.preset small{font-size:11px;color:var(--muted);display:block;margin-top:5px}.custom-time{display:flex;gap:8px;align-items:center;margin-top:11px}.custom-time input{width:0;min-width:0;flex:1;background:#080c18;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:11px 10px}.custom-time .unit{color:var(--muted);font-size:12px}.small-btn{border:1px solid var(--line);background:#ffffff0a;color:var(--text);border-radius:11px;padding:11px 12px;font-size:12px}.small-btn:hover{background:#ffffff16}
.divider{height:1px;background:var(--line)}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}.setting-row label{color:#dce2fa}.setting-row select{max-width:140px;background:#0b1020;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px;font-size:12px}.switch{position:relative;width:42px;height:24px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#ffffff20;border:1px solid var(--line);border-radius:30px;transition:.2s;cursor:pointer}.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#c5cbe0;transition:.2s}.switch input:checked+.slider{background:#8e7dff65}.switch input:checked+.slider:before{transform:translateX(18px);background:white}.settings{display:flex;flex-direction:column;gap:15px}.focus-tip{font-size:12px;color:var(--muted);line-height:1.7;background:#ffffff05;border:1px solid #ffffff0a;border-radius:14px;padding:13px}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#7d88a9;font-size:11px;margin:17px 5px 0}.kbd{border:1px solid var(--line);border-radius:5px;padding:2px 5px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){body{padding:15px;align-items:flex-start}.layout{grid-template-columns:1fr}.topbar{margin-top:4px}.main-panel{padding:22px 16px}.timer-shell{width:min(78vw,310px);margin-top:17px}.side{padding:19px}.footer{padding-bottom:8px}}
@media(max-width:380px){.top-actions .subtle-btn{padding:8px;font-size:11px}.brand{font-size:13px}.mode{font-size:12px}.primary{min-width:135px;padding:14px 15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="brand"><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8.5"/><path d="M12 8v5l3 2M9 2h6M12 2v2M18.5 5.5l1.5-1.5"/></svg></div><div>FOCUS FLOW<small>MAKE TIME COUNT</small></div></div>
  <div class="top-actions"><button class="subtle-btn" id="fullscreenBtn" type="button" title="全画面表示">⛶ 全画面</button><button class="subtle-btn" id="themeBtn" type="button" title="テーマを切り替え">◐ テーマ</button></div>
</header>
<div class="layout">
<section class="panel main-panel" aria-label="タイマー">
  <div class="mode-tabs" role="group" aria-label="タイマーモード">
    <button class="mode active" data-mode="focus" type="button" aria-pressed="true">集中</button><button class="mode" data-mode="short" type="button" aria-pressed="false">小休憩</button><button class="mode" data-mode="long" type="button" aria-pressed="false">長い休憩</button>
  </div>
  <div class="timer-shell">
    <svg class="timer-svg" viewBox="0 0 240 240" aria-hidden="true"><defs><linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9585ff"/><stop offset="100%" stop-color="#54e0c2"/></linearGradient></defs><circle class="track" cx="120" cy="120" r="108"/><circle class="arc" id="arc" cx="120" cy="120" r="108"/></svg>
    <div class="timer-content"><div class="mode-label" id="modeLabel">FOCUS SESSION</div><div class="digits" id="digits" role="timer" aria-live="off">25:00</div><div class="timer-note" id="timerNote">ひとつずつ、着実に。</div><div class="session-count"><span id="sessionText">今日の集中 0 回</span><span class="dots" id="sessionDots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></span></div></div>
  </div>
  <div class="controls"><button class="round-btn" id="resetBtn" type="button" aria-label="リセット" title="リセット">↺</button><button class="primary" id="startBtn" type="button">▶　スタート</button><button class="round-btn" id="skipBtn" type="button" aria-label="次のモードへ" title="次のモードへ">»</button></div>
  <div class="message" id="message" role="status" aria-live="polite"></div>
</section>
<aside class="panel side">
  <section><div class="section-heading"><h2>クイック設定</h2><span>FOCUS</span></div><div class="presets">
    <button class="preset active" data-min="25" type="button"><strong>25 分</strong><small>定番の集中時間</small></button><button class="preset" data-min="50" type="button"><strong>50 分</strong><small>じっくり取り組む</small></button><button class="preset" data-min="15" type="button"><strong>15 分</strong><small>まずは少しだけ</small></button><button class="preset" data-min="5" type="button"><strong>5 分</strong><small>すきま時間に</small></button>
  </div><form class="custom-time" id="customForm"><label class="sr-only" for="customMinutes">時間（分）</label><input id="customMinutes" type="number" min="1" max="180" value="25" required><span class="unit">分</span><button class="small-btn" type="submit">時間を設定</button></form></section>
  <div class="divider"></div>
  <section><div class="section-heading"><h2>環境設定</h2><span>OPTIONS</span></div><div class="settings">
    <div class="setting-row"><label for="soundToggle">終了音</label><label class="switch"><input id="soundToggle" type="checkbox" checked><span class="slider"></span></label></div>
    <div class="setting-row"><label for="autoBreak">集中後に休憩を提案</label><label class="switch"><input id="autoBreak" type="checkbox" checked><span class="slider"></span></label></div>
    <div class="setting-row"><label for="alarmStyle">終了音の種類</label><select id="alarmStyle"><option value="chime">やさしいチャイム</option><option value="bell">ベル</option><option value="digital">デジタル</option></select></div>
  </div></section>
  <div class="divider"></div>
  <div class="focus-tip" id="tip">💡 <strong>Focus tip</strong><br>始める前に、今回やることをひとつだけ決めてみよう。</div>
</aside>
</div>
<footer class="footer"><span>✦ 小さな集中を、積み重ねよう。</span><span>ヒント：<span class="kbd">Space</span> 開始・停止　<span class="kbd">R</span> リセット</span><span>設定はこの端末に保存されます</span></footer>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const MODES={focus:{label:'FOCUS SESSION',note:'ひとつずつ、着実に。',min:25},short:{label:'SHORT BREAK',note:'少し体を伸ばそう。',min:5},long:{label:'LONG BREAK',note:'ゆっくり休んでリフレッシュ。',min:15}};
const C=2*Math.PI*108;let mode='focus',total=1500,remaining=1500,running=false,interval=null,deadline=0,completed=0,theme='dark',audioCtx=null;
const arc=$('arc'),digits=$('digits'),start=$('startBtn'),message=$('message');
arc.style.strokeDasharray=C;const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){digits.textContent=fmt(remaining);arc.style.strokeDashoffset=C*(1-remaining/total);$('modeLabel').textContent=MODES[mode].label;document.title=`${fmt(remaining)} — Focus Flow`;const done=mode==='focus'?completed%4:0;[...$('sessionDots').children].forEach((d,i)=>d.classList.toggle('done',i<done));$('sessionText').textContent=`今日の集中 ${completed} 回`;start.textContent=running?'Ⅱ　停止':remaining===0?'↻　もう一度':'▶　スタート'}
function announce(s){message.textContent=s}
function stop(){if(interval!==null){clearInterval(interval);interval=null}running=false;render()}
function beep(){if(!$('soundToggle').checked)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();const style=$('alarmStyle').value;const notes=style==='bell'?[880,880,660]:style==='digital'?[520,780,520]:[660,830,990];notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*(style==='digital'?.13:.23);o.type=style==='digital'?'square':'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(style==='digital'?.06:.13,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+(style==='digital'?.1:.2));o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.22)})}catch(e){}}
function finish(){stop();remaining=0;render();beep();if(mode==='focus'){completed++;try{localStorage.setItem('ff_completed',String(completed))}catch(e){}render();if($('autoBreak').checked){announce('集中おつかれさま！ 小休憩でリフレッシュしよう ☕');$('tip').innerHTML='☕ <strong>休憩のすすめ</strong><br>画面から目を離して、水分補給や軽いストレッチを。'}else announce('時間になりました！ おつかれさま。')}else{announce('休憩終了！ 次の集中を始めよう。');$('tip').innerHTML='✨ <strong>再スタート</strong><br>戻ってきたら、次の小さな目標をひとつ決めよう。'}}
function tick(){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));render();if(remaining<=0)finish()}
function toggle(){if(running){stop();announce('一時停止中')}else{if(remaining<=0)remaining=total;running=true;deadline=Date.now()+remaining*1000;announce('');if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();render();interval=setInterval(tick,200)}}
function setMode(next){stop();mode=next;total=MODES[next].min*60;remaining=total;$('customMinutes').value=MODES[next].min;$('timerNote').textContent=MODES[next].note;document.querySelectorAll('.mode').forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',mode==='focus'&&Number(b.dataset.min)===total/60));announce('');render()}
function setTime(min){stop();mode='focus';total=min*60;remaining=total;$('timerNote').textContent=MODES.focus.note;$('customMinutes').value=min;document.querySelectorAll('.mode').forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',Number(b.dataset.min)===min));announce('時間を設定しました');render()}
start.addEventListener('click',toggle);
$('resetBtn').addEventListener('click',()=>{stop();remaining=total;announce('リセットしました');render()});
$('skipBtn').addEventListener('click',()=>setMode(mode==='focus'?'short':mode==='short'?'long':'focus'));
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>setTime(Number(b.dataset.min))));
$('customForm').addEventListener('submit',e=>{e.preventDefault();const n=Number($('customMinutes').value);if(!Number.isInteger(n)||n<1||n>180){announce('1〜180分で入力してください。');return}setTime(n)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea,button')&&e.code!=='Space')return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key.toLowerCase()==='r'){stop();remaining=total;announce('リセットしました');render()}});
$('fullscreenBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){announce('全画面表示はこのブラウザでは使えません。')}});
$('themeBtn').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';if(theme==='light'){document.documentElement.style.setProperty('--bg','#edf0ff');document.documentElement.style.setProperty('--panel','rgba(255,255,255,.82)');document.documentElement.style.setProperty('--line','rgba(40,52,95,.16)');document.documentElement.style.setProperty('--text','#18203a');document.documentElement.style.setProperty('--muted','#697493');document.body.style.background='radial-gradient(ellipse at 10% 0%,#d9d4ff 0,transparent 40%),radial-gradient(ellipse at 100% 100%,#c8f4e9 0,transparent 35%),#edf0ff';document.querySelectorAll('.panel').forEach(p=>p.style.background='rgba(255,255,255,.75)');document.querySelectorAll('.preset,.round-btn,.subtle-btn,.focus-tip').forEach(p=>{p.style.backgroundColor='#ffffffaa';p.style.color='var(--text)'})}else{['--bg','--panel','--line','--text','--muted'].forEach(v=>document.documentElement.style.removeProperty(v));document.body.style.background='';document.querySelectorAll('.panel').forEach(p=>p.style.background='');document.querySelectorAll('.preset,.round-btn,.subtle-btn,.focus-tip').forEach(p=>{p.style.backgroundColor='';p.style.color=''})}announce(theme==='light'?'ライトテーマ':'ダークテーマ');});
try{completed=Number(localStorage.getItem('ff_completed'))||0}catch(e){}render();
})();
</script>
</body>
</html>
